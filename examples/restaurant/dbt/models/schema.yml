version: 2

models:
  - name: stg_restaurants
    description: One row for each restaurant, with clearer column names.
    columns:
      - name: restaurant_id
        description: The restaurant's key.
        data_tests: [unique, not_null]
      - name: restaurant_name
        description: The name of the restaurant.
      - name: city
        description: The city the restaurant is in.
      - name: cuisine
        description: The kind of food it serves.
      - name: created_at
        description: When the restaurant opened.

  - name: stg_customers
    description: One row for each customer, with clearer column names.
    columns:
      - name: customer_id
        description: The customer's key.
        data_tests: [unique, not_null]
      - name: customer_name
        description: The customer's name.
      - name: city
        description: The customer's home city.
      - name: signed_up_at
        description: When the customer signed up.

  - name: stg_menu_items
    description: One row for each menu item, with clearer column names.
    columns:
      - name: menu_item_id
        description: The menu item's key.
        data_tests: [unique, not_null]
      - name: restaurant_id
        description: The restaurant that serves the item.
        data_tests: [not_null]
      - name: item_name
        description: The name of the item.
      - name: category
        description: What kind of dish it is, such as a main, a starter, a dessert or a drink.
      - name: price
        description: What the item costs on the menu.

  - name: stg_order_lines
    description: >
      Every line of every order loaded so far, with a key of its own. A line that was loaded twice appears twice, and the
      unique test on its key fails then.
    columns:
      - name: order_line_id
        description: The line's key, as order_id:line_no.
        data_tests: [unique, not_null]
      - name: order_id
        description: The order that the line belongs to.
        data_tests: [not_null]
      - name: line_no
        description: The number of the line in its order, from 1.
      - name: menu_item_id
        description: The item that was ordered.
        data_tests: [not_null]
      - name: quantity
        description: How many of the item were ordered.
      - name: unit_price
        description: What one of the item cost when it was ordered.

  - name: stg_reviews
    description: One row for each review that a customer left.
    columns:
      - name: review_id
        description: The review's key.
        data_tests: [unique, not_null]
      - name: order_id
        description: The order that the review is about.
      - name: customer_id
        description: The customer who wrote it.
      - name: restaurant_id
        description: The restaurant that the review is about.
        data_tests: [not_null]
      - name: rating
        description: The stars that the customer gave, from 1 to 5.
      - name: comment
        description: What the customer wrote.
      - name: reviewed_at
        description: When the review was left.

  - name: stg_orders
    description: Every version of every order loaded so far. An order that changed after it was loaded appears more than once.
    columns:
      - name: order_id
        description: The order's key. It is not unique here, because the raw orders keep every version.
        data_tests: [not_null]
      - name: restaurant_id
        description: The restaurant that took the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_restaurants')
                field: restaurant_id
      - name: customer_id
        description: The customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_ts
        description: When the order was placed.
      - name: channel
        description: How the order was served.
        data_tests:
          - accepted_values:
              arguments:
                values: ['dine_in', 'takeaway', 'delivery']
      - name: total_amount
        description: What the order cost, from its lines.
      - name: updated_at
        description: When the restaurant system last changed the order. It tells the versions of an order apart.

  - name: fct_orders
    description: >
      One row for each order, the latest version of it. It is loaded incrementally: an order is taken when the
      table has no row for it yet, or only an older version, so a late order is taken too, and a changed order
      replaces its earlier row.
    columns:
      - name: order_id
        description: The order's key.
        data_tests: [unique, not_null]
      - name: restaurant_id
        description: The restaurant that took the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_restaurants')
                field: restaurant_id
      - name: customer_id
        description: The customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_ts
        description: When the order was placed.
      - name: channel
        description: How the order was served.
        data_tests:
          - accepted_values:
              arguments:
                values: ['dine_in', 'takeaway', 'delivery']
      - name: total_amount
        description: What the order cost, from its lines.
      - name: updated_at
        description: When the restaurant system last changed the order.

  - name: customer_activity_monthly
    description: One row for each customer and each month in which they ordered.
    columns:
      - name: customer_month_id
        description: The customer and the month, as customer_id:YYYY-MM.
        data_tests: [unique, not_null]
      - name: customer_id
        description: The customer.
      - name: month
        description: The first day of the month.
      - name: orders
        description: How many orders the customer placed in the month.
      - name: revenue
        description: What those orders cost.

  - name: churn_by_month
    description: >
      Customer churn for each month, counted in the month a customer stops ordering. For month M, customers_at_start
      is the number of customers with an order in month M minus 1, churned is the number of those customers with no
      order in month M, churn_rate is churned divided by customers_at_start, or null when customers_at_start is 0, and
      active_customers is the number of customers with an order in month M. The first month has no row, because there
      is no month before it.
    columns:
      - name: month
        description: The first day of the month.
        data_tests: [unique, not_null]
      - name: customers_at_start
        description: How many customers had an order in the month before.
        data_tests: [not_null]
      - name: churned
        description: How many of them have no order in this month.
        data_tests: [not_null]
      - name: churn_rate
        description: churned divided by customers_at_start, or null when there were none. Between 0 and 1.
      - name: active_customers
        description: How many customers have an order in this month, which is 0 in a month with no order.
        data_tests: [not_null]

  - name: gold_daily_sales
    description: >
      Orders, revenue and the average ticket for each restaurant on each day it had an order. The average ticket is the
      revenue divided by the orders.
    columns:
      - name: restaurant_day_id
        description: The restaurant and the day, as restaurant_id:YYYY-MM-DD.
        data_tests: [unique, not_null]
      - name: day
        description: The day.
      - name: restaurant_id
        description: The restaurant.
      - name: restaurant_name
        description: The restaurant's name.
      - name: city
        description: The city the restaurant is in.
      - name: cuisine
        description: The kind of food the restaurant serves.
      - name: orders
        description: How many orders the restaurant took that day.
      - name: revenue
        description: What those orders cost.
      - name: avg_ticket
        description: What one of those orders cost on average, which is the revenue divided by the orders.

  - name: gold_menu_item_weekly
    description: >
      What each menu item sold in each week in which it was ordered. A week starts on Monday. A line counts when its order
      is in fct_orders.
    columns:
      - name: menu_item_week_id
        description: The menu item and the week, as menu_item_id:YYYY-MM-DD, with the Monday of the week.
        data_tests: [unique, not_null]
      - name: week
        description: The Monday of the week.
      - name: menu_item_id
        description: The menu item.
      - name: item_name
        description: The name of the item.
      - name: category
        description: What kind of dish it is.
      - name: restaurant_id
        description: The restaurant that serves the item.
      - name: restaurant_name
        description: The restaurant's name.
      - name: orders
        description: In how many orders the item was ordered that week.
      - name: quantity
        description: How many of the item were ordered that week.
      - name: revenue
        description: What those items cost at the prices they were ordered at.

  - name: gold_restaurant_scorecard
    description: >
      A scorecard for each restaurant. The orders and the revenue are those of the 30 days that end on the day of the
      newest order, counting that day. The rating is the average of all the reviews of the restaurant, and the rank is the
      rank of its revenue among the restaurants of its city.
    columns:
      - name: restaurant_id
        description: The restaurant.
        data_tests: [unique, not_null]
      - name: restaurant_name
        description: The restaurant's name.
      - name: city
        description: The city the restaurant is in.
      - name: cuisine
        description: The kind of food the restaurant serves.
      - name: as_of
        description: The day of the newest order, which is the last of the 30 days.
      - name: orders_30d
        description: How many orders the restaurant took in the 30 days that end on as_of.
      - name: revenue_30d
        description: What those orders cost.
      - name: review_count
        description: How many reviews the restaurant has.
      - name: rating_sum
        description: The stars of all its reviews added up, which with review_count gives the rating of a group of restaurants.
      - name: avg_rating
        description: The average of all its reviews, from 1 to 5, or no value when it has none.
      - name: city_rank
        description: The rank of its revenue among the restaurants of its city, where 1 is the best.
