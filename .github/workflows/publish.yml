name: Publish to PyPI

# Runs when a GitHub release is published. PyPI trusted publishing authenticates the upload,
# so the repo holds no PyPI token: the PyPI project must list this workflow and environment
# as a trusted publisher.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag is exactly v plus the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # An exact match. The old suffix match also accepted prefixed tags such as release-v0.1.1.
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG is not v$version, the version in pyproject.toml" >&2
            exit 1
          fi
      - name: Build the sdist and wheel from the repo root
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel
        run: make smoke PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pypi.org/p/local-data-platform
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
