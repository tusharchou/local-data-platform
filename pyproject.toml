[project]
name = "local-data-platform"
version = "0.1.4"
description = "A Python API layer for running a complete Iceberg lakehouse data platform on your laptop."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tushar Choudhary" },
    { name = "Local Data Platform contributors" },
]
requires-python = ">=3.12,<4"
dependencies = [
    # pyiceberg-core: from pyiceberg 0.10, writes partitioned by year/month/day/hour/bucket/truncate need it.
    "pyiceberg[pyarrow,sql-sqlite,pyiceberg-core]>=0.11,<0.13",
    "pyarrow>=17",
    "requests>=2.31",
    # Reads and checks `metadata.schedule` (windows.parse_schedule) and, from 0.1.3, computes the fire times of
    # `ldp schedule`. Pure Python with no dependencies of its own.
    "cronsim>=2.6,<3",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
bigquery = ["google-cloud-bigquery>=3.20", "google-auth>=2.20"]
# Experimental: SparkEngine in engine.spark. It also needs a JDK 17+; see docs/spark.md.
spark = ["pyspark>=4.0,<4.2"]
# The read-only MCP server for agents (`ldp mcp`, local_data_platform.mcp_server); see docs/agents.md.
mcp = ["mcp>=2.2,<3", "duckdb>=1.1"]
# AWS object storage. pyarrow's S3FileSystem already does the s3:// IO (fs.py and pyiceberg's default FileIO);
# boto3 is what pyiceberg needs to SigV4-sign REST catalog requests on AWS ("rest.sigv4-enabled"), such as
# S3 Tables or the Glue Iceberg REST endpoint. See docs/catalogs.md.
s3 = ["boto3>=1.34"]
# The AWS Glue catalog (catalog type "glue"). The provider imports boto3 lazily.
glue = ["pyiceberg[glue]>=0.11,<0.13"]
# dbt over Iceberg tables (`ldp dbt`, local_data_platform.dbt_layer): dbt-core with the dbt-duckdb adapter, run as a subprocess.
# It is not part of the dev extra, so the core install and `make test` never need it; tests that do carry the `dbt` marker.
dbt = ["dbt-core>=1.12,<2", "dbt-duckdb>=1.11,<2", "duckdb>=1.1"]
# Excel workbooks (.xlsx) as a source (the XLSX format, local_data_platform.format.excel). defusedxml makes openpyxl refuse a
# spreadsheet built to exhaust memory, and openpyxl uses it on its own when it is installed.
excel = ["openpyxl>=3.1", "defusedxml>=0.7"]
dev = [
    "pytest>=8",
    "flake8>=7",
    "build>=1.2",
    "duckdb>=1.1",
    # A local S3 and Glue endpoint for the fs.py and Glue catalog tests.
    "moto[server]>=5.0",
    # The MCP SDK, for the in-memory MCP server tests.
    "mcp>=2.2,<3",
    # The XLSX source: its tests build workbooks with openpyxl, so they run in every CI job.
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material==9.5.21",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.8.1",
]

[project.urls]
Repository = "https://github.com/tusharchou/local-data-platform"
Documentation = "https://local-data-platform.readthedocs.io"

[project.scripts]
ldp = "local_data_platform.cli:main"

[tool.poetry]
packages = [{ include = "local_data_platform", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: Spark integration tests (opt-in: LDP_RUN_SPARK=1 and scala-cli; see docs/spark.md)",
    "rest: Iceberg REST catalog integration tests (opt-in: LDP_RUN_REST=1 and scala-cli; see docs/catalogs.md)",
    "dbt: tests that run dbt (they skip without the dbt extra; the `dbt` CI job runs them with pytest -m dbt)",
]
